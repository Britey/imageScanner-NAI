[project]
name = "imgdupe"
version = "0.1.0"
description = "Local exact and near-duplicate image search using perceptual hashes."
requires-python = ">=3.11"
dependencies = [
    "imagehash",
    "numpy",
    "pillow",
    "tqdm",
]

[project.optional-dependencies]
test = ["coverage==7.17.2"]

[project.scripts]
imgdupe = "imgdupe.cli:main"

[tool.setuptools.packages.find]
include = ["imgdupe*"]

[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"

[tool.coverage.run]
branch = true
source = ["imgdupe"]

[tool.coverage.report]
fail_under = 100
precision = 2
show_missing = true
exclude_lines = []
partial_branches = []
